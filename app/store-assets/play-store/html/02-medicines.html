<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="phone.css" />
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span class="icons">●●●  100%</span></div>
    <div class="content" style="padding-top: 8px;">
      <div class="page-title">Medicine</div>
      <p style="margin:-8px 4px 18px;color:var(--muted);font-size:24px;">20,414 products · Genuine pharmacy packs</p>
      <div class="chips">
        <div class="chip on">All</div>
        <div class="chip">Tablet</div>
        <div class="chip">Syrup</div>
        <div class="chip">Capsule</div>
      </div>
      <div class="row" style="margin-bottom:18px;">
        <div class="card">
          <div class="img-wrap"><img src="../media/pack-tablet.jpg" alt="" /></div>
          <div class="body"><div class="name">Atova 10 mg Tablet</div><div class="price">Tk 108 <span class="compare">Tk 132</span></div></div>
        </div>
        <div class="card">
          <div class="img-wrap"><img src="../media/tablet.jpg" alt="" /></div>
          <div class="body"><div class="name">Bislol 2.5 mg Tablet</div><div class="price">Tk 56</div></div>
        </div>
      </div>
      <div class="row" style="margin-bottom:18px;">
        <div class="card">
          <div class="img-wrap"><img src="../media/pack-syrup.jpg" alt="" /></div>
          <div class="body"><div class="name">A-Cold 4 mg/5 ml Syrup</div><div class="price">Tk 65</div></div>
        </div>
        <div class="card">
          <div class="img-wrap"><img src="../media/syrup.jpg" alt="" /></div>
          <div class="body"><div class="name">Napa 120 mg/5 ml Syrup</div><div class="price">Tk 70</div></div>
        </div>
      </div>
      <div class="row">
        <div class="card">
          <div class="img-wrap"><img src="../media/capsule.jpg" alt="" /></div>
          <div class="body"><div class="name">Seclo 20 mg Capsule</div><div class="price">Tk 70</div></div>
        </div>
        <div class="card">
          <div class="img-wrap"><img src="../media/injection.jpg" alt="" /></div>
          <div class="body"><div class="name">A-Clox 500 mg Injection</div><div class="price">Tk 48</div></div>
        </div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active"><div class="badge">⌂</div>Home</div>
      <div class="tab"><div>🩺</div>Doctors</div>
      <div class="tab"><div>👜</div>Cart</div>
      <div class="tab"><div>☺</div>Account</div>
    </div>
  </div>
</body>
</html>
